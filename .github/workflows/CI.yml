name: Frontend-BMI Calculator

on:
  push:
    branches: [ "main" ]
  # pull_request:
  #   branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone your code
      - name: Checkout repository code
        uses: actions/checkout@v4


      # Step 2: Log in to your Docker Hub account
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3: Build the Dockerfile and push it to Docker Hub
      - name: Build and push Docker image to registry
        uses: docker/build-push-action@v7
        with:
          context: . # Looks for the Dockerfile in the root directory
          push: true # Instructs the action to push the image after a successful build
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ecom-app:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }}

         







