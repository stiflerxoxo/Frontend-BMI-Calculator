name: CI/CD pipeline in Github Action for ECR (Elastic Container Registry)

on:
  push:
    branches: [ "main" ]
  # pull_request:
  #   branches: [ main ]
#       - '**' # Triggers on changes to any branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down the repository source code onto the GitHub runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configure AWS credentials so the runner can talk to your AWS account
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1 # Ensure this matches your target AWS ECR region

      # 3. Log into ECR using the AWS CLI tool
      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY_URI }}

      # 4. Build, dynamically tag, and push the image to AWS ECR
      - name: Build and push docker image to registry
        env:
          ECR_REPOSITORY_URI: ${{ secrets.ECR_REPOSITORY_URI }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          # Build the image locally
          docker build -t devops-webapp .
          
          # Tag the image using the ECR URI format and the current branch name
          docker tag devops-webapp $ECR_REPOSITORY_URI/devops-webapp:$BRANCH_NAME
          
          # Push the final image to your remote container registry
          docker push $ECR_REPOSITORY_URI/devops-webapp:$BRANCH_NAME

      # 5. Connect to your server over SSH and deploy the latest app container
      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Log into ECR on your remote server using your AWS credentials 
            AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY_URI }}
            
            # Navigate to your deployment folder on the server
            cd /home/ubuntu/app/devops-webapp
            
            # Pull down the specific image matching the git branch that triggered this run
            docker compose pull
            
            # Recreate running containers with the fresh layers in the background
            docker compose up -d
